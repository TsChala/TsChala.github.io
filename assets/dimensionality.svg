<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" role="img" aria-labelledby="title desc">
  <title id="title">Nonlinear dimensionality reduction</title><desc id="desc">A curved high-dimensional data manifold folding into a compact two-dimensional latent space with separated clusters.</desc>
  <defs><linearGradient id="surf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20a9a7"/><stop offset=".48" stop-color="#e8dec7"/><stop offset="1" stop-color="#e7653d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <rect width="650" height="450" fill="#0c222e"/>
  <g opacity=".14" stroke="#bddfdc"><path d="M45 65h560M45 125h560M45 185h560M45 245h560M45 305h560M45 365h560"/><path d="M85 35v365M165 35v365M245 35v365M325 35v365M405 35v365M485 35v365M565 35v365"/></g>
  <!-- Swiss-roll manifold -->
  <path d="M72 255c24-131 175-190 285-113 65 45 41 135-31 147-72 12-126-34-96-79 25-38 90-31 104 8" fill="none" stroke="url(#surf)" stroke-width="46" opacity=".23" filter="url(#glow)"/>
  <path d="M72 255c24-131 175-190 285-113 65 45 41 135-31 147-72 12-126-34-96-79 25-38 90-31 104 8" fill="none" stroke="url(#surf)" stroke-width="3"/>
  <g fill="#22aaa8"><circle cx="77" cy="249" r="6"/><circle cx="101" cy="188" r="5"/><circle cx="143" cy="137" r="6"/><circle cx="204" cy="112" r="5"/></g><g fill="#e9d4ae"><circle cx="275" cy="121" r="6"/><circle cx="330" cy="148" r="5"/><circle cx="359" cy="194" r="6"/></g><g fill="#ee7049"><circle cx="355" cy="254" r="6"/><circle cx="317" cy="287" r="5"/><circle cx="264" cy="275" r="6"/><circle cx="226" cy="241" r="5"/><circle cx="250" cy="204" r="6"/><circle cx="304" cy="199" r="5"/></g>
  <!-- encoder funnel -->
  <path d="M382 174 450 211 382 248" fill="none" stroke="#d8e8e6" stroke-width="2"/><path d="m435 200 15 11-15 11" fill="#d8e8e6"/>
  <!-- latent plane -->
  <path d="m464 154 145 52-45 130-144-52Z" fill="#102f3b" stroke="#6b9198" stroke-width="2"/>
  <g stroke="#52727a" opacity=".5"><path d="m449 196 145 52M437 236l145 52M478 159l-44 130M526 177l-44 130M574 194l-44 130"/></g>
  <g fill="#21aaa8"><circle cx="470" cy="224" r="7"/><circle cx="486" cy="210" r="5"/><circle cx="493" cy="237" r="6"/><circle cx="508" cy="218" r="5"/></g><g fill="#ead9ba"><circle cx="532" cy="258" r="6"/><circle cx="546" cy="245" r="5"/><circle cx="553" cy="270" r="7"/></g><g fill="#eb6d48"><circle cx="513" cy="300" r="6"/><circle cx="536" cy="309" r="5"/><circle cx="554" cy="293" r="7"/><circle cx="570" cy="312" r="5"/></g>
  <ellipse cx="520" cy="250" rx="83" ry="74" fill="none" stroke="url(#surf)" stroke-width="2" opacity=".45" filter="url(#glow)"/>
</svg>
