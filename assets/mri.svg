<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" role="img" aria-labelledby="title desc">
  <title id="title">4D flow MRI denoising</title><desc id="desc">A noisy velocity field in an aneurysm is passed through a denoising network to produce a smooth reconstructed flow field.</desc>
  <defs><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#20aaa8"/><stop offset=".55" stop-color="#f0dfbd"/><stop offset="1" stop-color="#e7653d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <rect width="650" height="450" fill="#0c222e"/>
  <!-- left noisy scan -->
  <rect x="34" y="62" width="225" height="300" rx="3" fill="#102f3b" stroke="#668992"/>
  <path d="M74 336c11-60 13-110 30-151 20-49 65-50 90-13 22 32 18 76-4 107-20 28-47 33-65 9-15-20-5-49 17-58 25-10 46 9 51 34" fill="none" stroke="#577985" stroke-width="41" opacity=".7"/>
  <g stroke="url(#flow)" stroke-width="2" opacity=".72"><path d="M75 330c16-72 19-126 51-158 25-25 62-11 69 24"/><path d="M90 337c13-66 21-117 49-143 20-18 46-4 53 20"/><path d="M106 337c10-57 22-100 47-116 15-10 31 1 37 18"/></g>
  <g fill="#dbe9e8" opacity=".55"><circle cx="53" cy="89" r="2"/><circle cx="74" cy="144" r="3"/><circle cx="117" cy="109" r="2"/><circle cx="150" cy="82" r="3"/><circle cx="214" cy="112" r="2"/><circle cx="232" cy="189" r="3"/><circle cx="55" cy="244" r="3"/><circle cx="93" cy="280" r="2"/><circle cx="215" cy="319" r="3"/><circle cx="167" cy="336" r="2"/><circle cx="125" cy="244" r="3"/><circle cx="187" cy="205" r="2"/></g>
  <g stroke="#e3efed" opacity=".4"><path d="m67 165 9-8m-4 13 8 6M115 302l9-7m-4 13 8 5M205 148l10 4m-5-9 4-8M216 280l8-8m-2 13 9 4"/></g>
  <!-- network -->
  <g stroke="#92b8bb" stroke-width="1" opacity=".75"><path d="M285 178h23M285 225h23M285 272h23M342 147l45 31M342 194l45-16M342 194l45 47M342 241l45-63M342 241l45 63M342 288l45-47"/></g>
  <g fill="#1b6f77" stroke="#8ac4c4"><circle cx="319" cy="147" r="10"/><circle cx="319" cy="194" r="10"/><circle cx="319" cy="241" r="10"/><circle cx="319" cy="288" r="10"/></g><g fill="#e36b48" stroke="#ffc0a7"><circle cx="397" cy="178" r="10"/><circle cx="397" cy="241" r="10"/><circle cx="397" cy="304" r="10"/></g>
  <path d="M418 225h24m-10-10 10 10-10 10" fill="none" stroke="#e9f1ef" stroke-width="2"/>
  <!-- clean output -->
  <rect x="450" y="62" width="166" height="300" rx="3" fill="#102f3b" stroke="#668992"/>
  <path d="M477 336c9-60 10-110 23-151 16-49 49-50 67-13 17 32 14 76-3 107-15 28-35 33-49 9-11-20-4-49 13-58 18-10 34 9 38 34" fill="none" stroke="#315866" stroke-width="34"/>
  <g fill="none" stroke="url(#flow)" filter="url(#glow)"><path d="M478 333c11-67 15-122 37-158 17-27 43-16 51 15" stroke-width="5"/><path d="M491 336c9-59 16-108 34-135 13-19 33-7 39 16" stroke-width="4"/><path d="M504 337c8-49 17-91 31-108 10-12 23 0 27 16" stroke-width="3"/></g>
  <g fill="none" stroke="#5f838b" opacity=".45"><circle cx="533" cy="215" r="73"/><circle cx="533" cy="215" r="93"/></g>
</svg>
