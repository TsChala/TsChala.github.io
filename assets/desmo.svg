  <rect width="650" height="450" fill="#0c222e"/>
  <!-- mode panels -->
  <g transform="translate(35 72)"><rect width="142" height="156" rx="3" fill="#102f3b" stroke="#5d7f88"/><g fill="none" stroke="#25aaa8"><path d="M-10 44c40-31 67 28 101-3s59 19 71 7"/><path d="M-10 70c40-31 67 28 101-3s59 19 71 7" opacity=".7"/><path d="M-10 96c40-31 67 28 101-3s59 19 71 7" opacity=".45"/></g><circle cx="88" cy="68" r="22" fill="none" stroke="#dce9e6" opacity=".45"/></g>
