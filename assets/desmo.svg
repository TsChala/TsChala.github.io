  <g transform="translate(473 72)"><rect width="142" height="156" rx="3" fill="#102f3b" stroke="#5d7f88"/><g fill="none" stroke="#e76d49"><path d="M12 121c23-109 53 52 75-38s42 29 53-49"/><path d="M12 103c23-92 53 44 75-32s42 24 53-42" opacity=".6"/></g></g>
  <!-- coefficient labels and plus signs -->
