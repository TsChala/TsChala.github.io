<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" role="img" aria-labelledby="title desc">
  <title id="title">Decomposed sparse modal optimization</title><desc id="desc">Three fluid modes with temporal coefficients are added in an equation to reconstruct a flow field.</desc>
