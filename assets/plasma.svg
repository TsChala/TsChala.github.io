<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional tokamak</title>
  <desc id="desc">An oblique three-dimensional tokamak with a glowing toroidal plasma and illuminated magnetic coils.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071823"/>
      <stop offset=".55" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#102e38"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8d0d3"/>
      <stop offset=".22" stop-color="#5f8089"/>
      <stop offset=".58" stop-color="#294854"/>
      <stop offset="1" stop-color="#132f3b"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8e6e4"/>
      <stop offset=".35" stop-color="#6d9298"/>
      <stop offset="1" stop-color="#284854"/>
    </linearGradient>
    <linearGradient id="plasma" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#20aaa8"/>
      <stop offset=".25" stop-color="#7fe0d4"/>
      <stop offset=".5" stop-color="#f4e2bc"/>
      <stop offset=".72" stop-color="#ff8b5c"/>
      <stop offset="1" stop-color="#e75f3d"/>
    </linearGradient>
    <radialGradient id="plasmaHalo">
      <stop stop-color="#f2d09e" stop-opacity=".58"/>
      <stop offset=".45" stop-color="#e7653d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#20aaa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solenoid" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a6267"/>
      <stop offset=".42" stop-color="#56c8bc"/>
      <stop offset=".68" stop-color="#d9eadc"/>
      <stop offset="1" stop-color="#176f72"/>
    </linearGradient>
    <filter id="softGlow" x="-45%" y="-80%" width="190%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brightGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="frontHalf"><rect x="-290" y="0" width="580" height="155"/></clipPath>
    <clipPath id="backHalf"><rect x="-290" y="-150" width="580" height="151"/></clipPath>
  </defs>

  <rect width="900" height="420" fill="url(#background)"/>
  <g fill="none" stroke="#82c9c4" stroke-width="1" opacity=".09">
    <path d="M0 345 450 205 900 345M0 390 450 224 900 390M86 420 450 224 814 420M242 420 450 224 658 420"/>
    <path d="M112 308h676M39 346h822M0 390h900"/>
  </g>
  <g fill="#bde7df" opacity=".35"><circle cx="116" cy="96" r="2"/><circle cx="757" cy="79" r="1.5"/><circle cx="810" cy="176" r="2"/><circle cx="180" cy="211" r="1.5"/><circle cx="685" cy="308" r="1.5"/></g>

  <ellipse cx="450" cy="342" rx="284" ry="42" fill="#020b10" opacity=".52" filter="url(#shadow)"/>
  <ellipse cx="450" cy="207" rx="300" ry="143" fill="url(#plasmaHalo)" opacity=".42" filter="url(#softGlow)"/>

  <g transform="translate(450 211) rotate(-9)">
    <!-- rear halves of the toroidal-field coil cage -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-246 58C-275-45-224-123-127-153C-74-170 74-170 127-153C224-123 275-45 246 58" stroke="#173844" stroke-width="25"/>
      <path d="M-205 82C-248-18-199-126-90-159C-41-174 41-174 90-159C199-126 248-18 205 82" stroke="#24505b" stroke-width="23"/>
      <path d="M-151 102C-202 8-163-118-62-163C-25-180 25-180 62-163C163-118 202 8 151 102" stroke="#315f68" stroke-width="21"/>
      <path d="M-92 114C-142 28-113-104-39-159C-15-177 15-177 39-159C113-104 142 28 92 114" stroke="#3e7076" stroke-width="19"/>
      <g stroke="#9ab8b8" stroke-width="3" opacity=".66">
        <path d="M-246 58C-275-45-224-123-127-153C-74-170 74-170 127-153C224-123 275-45 246 58"/>
        <path d="M-205 82C-248-18-199-126-90-159C-41-174 41-174 90-159C199-126 248-18 205 82"/>
        <path d="M-151 102C-202 8-163-118-62-163C-25-180 25-180 62-163C163-118 202 8 151 102"/>
        <path d="M-92 114C-142 28-113-104-39-159C-15-177 15-177 39-159C113-104 142 28 92 114"/>
      </g>
    </g>

    <!-- central solenoid, visible through the torus aperture -->
    <g transform="translate(3 -1)">
      <rect x="-31" y="-123" width="62" height="213" rx="13" fill="url(#solenoid)" stroke="#8bacb0" stroke-width="3"/>
      <ellipse cx="0" cy="-123" rx="31" ry="10" fill="#aec6c7" stroke="#dce8e5" stroke-width="2"/>
      <ellipse cx="0" cy="90" rx="31" ry="10" fill="#173440" stroke="#65868d" stroke-width="2"/>
      <g fill="none" stroke="#0b4f55" stroke-width="6" opacity=".85">
        <path d="M-28-90h56M-29-57h58M-30-24h60M-30 9h60M-29 42h58M-28 75h56"/>
      </g>
      <path d="M-16-107v174" stroke="#f0dfbd" stroke-width="3" opacity=".62"/>
    </g>

    <!-- restrained vessel rim behind the luminous plasma -->
    <ellipse rx="222" ry="99" fill="none" stroke="#5d7d84" stroke-width="18" opacity=".52"/>
    <ellipse rx="252" ry="116" fill="none" stroke="#9db9b9" stroke-width="3" opacity=".55"/>

    <!-- exposed toroidal plasma -->
    <ellipse rx="178" ry="72" fill="none" stroke="#e7653d" stroke-width="58" opacity=".35" filter="url(#softGlow)"/>
    <ellipse rx="178" ry="72" fill="none" stroke="url(#plasma)" stroke-width="45" opacity=".9" filter="url(#brightGlow)"/>
    <ellipse rx="178" ry="72" fill="none" stroke="#fff2d1" stroke-width="4" opacity=".9"/>
    <path d="M-176 0A178 72 0 0 0 176 0" fill="none" stroke="#ff7448" stroke-width="8" opacity=".9" filter="url(#brightGlow)"/>

    <!-- dark central opening -->
    <ellipse rx="105" ry="39" fill="#071923" opacity=".88"/>
    <ellipse rx="105" ry="39" fill="none" stroke="#73939a" stroke-width="5" opacity=".72"/>
    <path d="M-101 7A105 39 0 0 0 101 7" fill="none" stroke="#183b46" stroke-width="8"/>

    <!-- restrained cutaway armor segments -->
    <g fill="none" stroke-linecap="round">
      <path d="M-223 6A224 101 0 0 0-164 70" stroke="url(#steelEdge)" stroke-width="25"/>
      <path d="M164 70A224 101 0 0 0 223 6" stroke="url(#steelEdge)" stroke-width="25"/>
      <path d="M-232 5A235 107 0 0 0-164 79M164 79A235 107 0 0 0 232 5" stroke="#c5d8d7" stroke-width="3" opacity=".7"/>
    </g>

    <!-- foreground arcs complete the surrounding magnetic-coil cage -->
    <g fill="none" stroke-linecap="round">
      <path d="M-213-102C-261-38-257 79-190 139M213-102C261-38 257 79 190 139" stroke="#173844" stroke-width="25"/>
      <path d="M-147-139C-205-55-195 78-126 151M147-139C205-55 195 78 126 151" stroke="#24505b" stroke-width="23"/>
      <path d="M-75-158C-126-62-113 72-61 151M75-158C126-62 113 72 61 151" stroke="#315f68" stroke-width="21"/>
      <g stroke="#afc7c5" stroke-width="3" opacity=".72">
        <path d="M-213-102C-261-38-257 79-190 139M213-102C261-38 257 79 190 139M-147-139C-205-55-195 78-126 151M147-139C205-55 195 78 126 151M-75-158C-126-62-113 72-61 151M75-158C126-62 113 72 61 151"/>
      </g>
    </g>

    <!-- central solenoid brought forward through the opening -->
    <g transform="translate(3 -45)">
      <rect x="-25" y="-83" width="50" height="123" rx="10" fill="url(#solenoid)" stroke="#a4cbc4" stroke-width="3"/>
      <ellipse cx="0" cy="-83" rx="25" ry="8" fill="#8dd8c9" stroke="#e3efe5" stroke-width="2"/>
      <g fill="none" stroke="#0b5559" stroke-width="5"><path d="M-23-59h46M-24-34h48M-24-9h48M-23 16h46"/></g>
      <path d="M-12-70v92" stroke="#f0dfbd" stroke-width="3" opacity=".6"/>
    </g>

    <!-- sweeping magnetic-field trajectories -->
    <g fill="none" stroke-linecap="round">
      <path d="M-137-3C-87-55 75-62 146-14C184 12 155 54 83 68C2 84-100 61-128 25" stroke="#f0dfbd" stroke-width="3" opacity=".62"/>
      <path d="M-119 26C-56-13 74-14 131 22C158 39 122 63 62 69" stroke="#20aaa8" stroke-width="4" opacity=".78" filter="url(#brightGlow)"/>
      <path d="M-17-34c-35 22-38 76-4 98C13 86 54 57 43 21C33-11 3-20-17-4" stroke="#e7653d" stroke-width="3" opacity=".72"/>
    </g>

    <!-- illuminated lower rim -->
    <path d="M-145 85A231 104 0 0 0 145 85" fill="none" stroke="#20aaa8" stroke-width="5" opacity=".8" filter="url(#brightGlow)"/>

    <!-- support feet -->
    <g fill="url(#steel)" stroke="#78959a" stroke-width="2">
      <path d="m-177 77-24 88h44l19-70Z"/>
      <path d="m177 77 24 88h-44l-19-70Z"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" opacity=".48">
    <path d="M176 143c57-62 116-90 179-105" stroke="#20aaa8" stroke-width="2"/>
    <path d="M719 287c-42 38-87 61-136 72" stroke="#e7653d" stroke-width="2"/>
  </g>
  <g fill="#d7f2ec"><circle cx="176" cy="143" r="3"/><circle cx="719" cy="287" r="3"/></g>
</svg>
