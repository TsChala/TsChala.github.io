<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Tokamak plasma edge dynamics</title><desc id="desc">A glowing toroidal tokamak plasma with an illuminated outer edge, magnetic field lines, and a divertor.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="46%" r="54%"><stop offset="0" stop-color="#f8d8a2"/><stop offset=".35" stop-color="#e7653d"/><stop offset=".72" stop-color="#167d86"/><stop offset="1" stop-color="#0b1d29"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#25b9b4"/><stop offset=".52" stop-color="#f4e5c6"/><stop offset="1" stop-color="#ff7448"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="420" fill="#0b1d29"/>
  <g opacity=".12" stroke="#b9f2e7"><path d="M0 70h900M0 140h900M0 210h900M0 280h900M0 350h900"/><path d="M90 0v420M180 0v420M270 0v420M360 0v420M450 0v420M540 0v420M630 0v420M720 0v420M810 0v420"/></g>
  <!-- tokamak vessel -->
  <path d="M211 211c0-112 108-173 239-173s239 61 239 173-108 173-239 173-239-61-239-173Z" fill="none" stroke="#65808a" stroke-width="16" opacity=".62"/>
  <path d="M266 211c0-79 82-121 184-121s184 42 184 121-82 121-184 121-184-42-184-121Z" fill="none" stroke="#274855" stroke-width="6"/>
  <!-- toroidal plasma -->
  <path d="M293 211c0-66 72-97 157-97s157 31 157 97-72 97-157 97-157-31-157-97Zm88 0c0 27 31 40 69 40s69-13 69-40-31-40-69-40-69 13-69 40Z" fill="url(#core)" fill-rule="evenodd" opacity=".92"/>
  <ellipse cx="450" cy="211" rx="158" ry="98" fill="none" stroke="url(#edge)" stroke-width="8" filter="url(#glow)"/>
  <ellipse cx="450" cy="211" rx="72" ry="43" fill="#0b1d29" stroke="#193845" stroke-width="3"/>
  <!-- magnetic field contours -->
  <g fill="none" stroke="#d8f2ed" opacity=".38"><ellipse cx="450" cy="211" rx="133" ry="81"/><ellipse cx="450" cy="211" rx="111" ry="67"/><path d="M330 164c50 28 188 29 240 0M330 258c50-28 188-29 240 0"/></g>
  <!-- coils -->
  <g fill="#102d38" stroke="#6c8c95" stroke-width="3"><rect x="182" y="136" width="35" height="54" rx="6"/><rect x="182" y="232" width="35" height="54" rx="6"/><rect x="683" y="136" width="35" height="54" rx="6"/><rect x="683" y="232" width="35" height="54" rx="6"/><rect x="301" y="32" width="56" height="24" rx="5"/><rect x="543" y="32" width="56" height="24" rx="5"/></g>
  <!-- divertor / bright edge strike points -->
  <path d="M380 304 350 371h64l36-62 36 62h64l-30-67" fill="none" stroke="#607f89" stroke-width="12" stroke-linejoin="round"/>
  <g fill="#ff8055" filter="url(#glow)"><circle cx="397" cy="326" r="8"/><circle cx="503" cy="326" r="8"/></g>
  <g fill="none" stroke-linecap="round" opacity=".65"><path d="M735 147c-44 0-76 17-116 39" stroke="#58b5b3"/><path d="M545 360c-20-4-32-13-42-29" stroke="#ff8b65"/></g>
  <g fill="#dff5f1"><circle cx="735" cy="147" r="3"/><circle cx="619" cy="186" r="3"/></g>
</svg>
